command_help:
  disk_analysis: "Opens the disk usage analyzer for the drive containing the active pane's current location. Analyzes the entire drive, not just the current folder or selection. Requires a local NTFS volume; network drives, unsupported filesystems and locations without a current drive are unavailable. Opens in a separate window and has no keyboard shortcut."
  preview_selected: "Opens the focused file in its viewer or player, even when several items are selected. Supports images, video, audio, PDF, DOCX, XLSX and supported text formats. Unavailable for folders, unsupported formats and files inside archives. This is different from showing or hiding the details preview panel."
  copy: "Places the active pane's selected files and folders on the clipboard. Originals remain in place; use Paste in the destination folder to copy them. Unavailable for drives, network roots and the Recycle Bin."
  cut: "Marks the active pane's selected files and folders for moving. Cutting does not move them immediately; use Paste in the destination to start the move. Unavailable for drives, network roots, archive contents, the Recycle Bin and folders currently open in either pane or containing an open folder."
  paste: "Copies or moves clipboard files into the active pane's current folder, not into a selected subfolder. Uses the existing progress, conflict and error handling. Requires files on the clipboard and a destination that supports file operations."
  delete: "Deletes the active pane's selected files and folders using the standard Windows delete operation and its existing confirmations. The Recycle Bin is used only where supported; some destinations, including network locations, may delete permanently. No selection means nothing is deleted."
  inputs: "Keyboard and mouse: %{inputs}"
  new_tab: "Opens a main tab at the new-tab location chosen in settings, leaving the current tab open. The tab limit still applies."
  close_tab: "Closes the active main tab, not just a pane inside it. Pinned tabs must be unpinned first. Closing the last main tab closes the window."
  reopen_tab: "Restores the most recently closed main tab from this window's tab history. Requires a closed tab and an available tab slot."
  back: "Returns to the previous location in the active pane's navigation history. It does not undo file operations."
  forward: "Moves forward in the active pane's navigation history after going back. Available only when a forward location exists."
  up: "Navigates to the parent of the active pane's current location. Unavailable when that location has no parent."
  refresh: "Reloads the active pane's current listing to reflect changes to files and folders. Use it when the displayed contents appear out of date."
  address: "Activates the address field for the current location. Type or paste a folder path and press Enter to navigate; Escape cancels editing."
  grid: "Displays the active pane as a grid of icons or thumbnails, useful for identifying files visually. A locked folder view must be unlocked before changing modes."
  details: "Displays the active pane as rows with file details in columns, useful for comparing metadata and sorting by a column. This is not the preview panel."
  columns: "Displays the active pane as a compact list arranged in multiple columns. Items fill each column from top to bottom before continuing in the next column."
  miller: "Displays folders in adjacent navigation columns, keeping ancestor folders visible while browsing deeper into the folder hierarchy."
  next_view: "Cycles the active pane to the next display mode: Grid, Details, Column List or Miller's Columns. A locked folder view prevents mode changes."
  previous_view: "Cycles the active pane through the display modes in the reverse direction. A locked folder view prevents mode changes."
  preview: "Shows or hides the details and preview panel for the selected item. This changes panel visibility; it is different from the action that opens or plays the selected file."
  sidebar: "Shows or hides the left sidebar containing drives and navigation locations. Hiding it gives the file listing more space without changing the current folder."
  dual_panel: "Enables or disables the two-pane file browsing layout. Each pane has its own location and selection; selection commands act on the active pane."
  global_search: "Opens the global search window to find indexed files and folders beyond the current folder. Enter a query and use the available filters to narrow results."
  select_all: "Selects every item in the active pane's current filtered listing. It does not select items excluded by the current filters or items in the other pane."
  clear_selection: "Deselects the active pane's files and folders and clears the selection preview. It does not delete files or change the current listing filters."
  invert_selection: "Selects currently unselected items and deselects selected items in the active pane's filtered listing. The current search and filters remain unchanged."
  create_folder: "Creates a folder in the active pane's current location and lets you name it. Available only in locations that support folder creation."
  rename: "Starts renaming the selected file or folder. With multiple items selected, opens batch renaming instead. Availability depends on the selected items and location."
  properties: "Opens the Windows properties dialog for the selected file or folder, or the selected group. Requires a selection in a supported location."
  settings: "Opens application settings on the General section. Use the settings sections to adjust appearance, navigation, keyboard shortcuts and other preferences."

