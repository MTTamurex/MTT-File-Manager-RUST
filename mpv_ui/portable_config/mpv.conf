osc=no
deinterlace=auto
autofit=50%
scale=spline36
scale-antiring=0
dscale=bilinear
dscale-antiring=0
cscale=spline36
cscale-antiring=0
deband=no
correct-downscaling=yes
linear-downscaling=no
sigmoid-upscaling=yes
target-colorspace-hint=yes
target-peak=400
hdr-compute-peak=yes
inverse-tone-mapping=no
tone-mapping=auto
tone-mapping-param=0.3 # assume spline
saturation=0
hdr-peak-percentile=99.0
gpu-max-shader-storage=64
gpu-shader-cache=4
hwdec-extra-frames=4

# Integrated GPUs share the 3D engine and RAM bandwidth with the app UI and
# DWM, so 4K and larger videos use cheaper scaling there. The app publishes
# user-data/mtt/integrated-gpu; values are restored for lighter videos.
[igpu-heavy-video]
profile-cond=get("user-data/mtt/integrated-gpu", false) and width ~= nil and height ~= nil and width * height > 2560 * 1440
profile-restore=copy
scale=bilinear
cscale=bilinear
sigmoid-upscaling=no
correct-downscaling=no
hdr-compute-peak=no
