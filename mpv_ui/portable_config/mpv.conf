osc=no
deinterlace=auto
autofit=50%
scale=spline36
scale-antiring=0
dscale=bilinear
dscale-antiring=0
cscale=spline36
cscale-antiring=0
deband=no
correct-downscaling=yes
linear-downscaling=no
sigmoid-upscaling=yes
target-colorspace-hint=yes
target-peak=400
hdr-compute-peak=yes
inverse-tone-mapping=no
tone-mapping=auto
tone-mapping-param=0.3 # assume spline
saturation=0
hdr-peak-percentile=99.0
gpu-max-shader-storage=64
gpu-shader-cache=4
hwdec-extra-frames=4

# Integrated GPUs share the 3D engine and RAM bandwidth with the app UI and
# DWM, so heavy videos use cheaper scaling there: sources above 1440p, HDR
# sources (PQ/HLG tone mapping runs on every output pixel), or output (window)
# pixels x fps above 1440p60, e.g. 1080p60 shown full screen on a 4K monitor.
# Files without a container fps (often VP9/WebM) count as 60.
# The app publishes user-data/mtt/integrated-gpu; values are restored for
# lighter videos.
[igpu-heavy-video]
profile-cond=get("user-data/mtt/integrated-gpu", false) and width ~= nil and height ~= nil and (width * height > 2560 * 1440 or get("video-params", {}).gamma == "pq" or get("video-params", {}).gamma == "hlg" or (get("osd-dimensions", {}).w or 0) * (get("osd-dimensions", {}).h or 0) * get("container-fps", 60) > 2560 * 1440 * 60)
profile-restore=copy
scale=bilinear
cscale=bilinear
sigmoid-upscaling=no
correct-downscaling=no
hdr-compute-peak=no
